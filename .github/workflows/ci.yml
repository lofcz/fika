name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            echo "bun --canary install attempt ${attempt}/5"
            if bun --canary install --frozen-lockfile; then
              exit 0
            fi
            echo "bun --canary install failed (attempt ${attempt}/5), retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun --canary run type-check

      - name: Start dev server
        run: |
          bun --canary run dev &
          echo $! > /tmp/fika-dev.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5173/src/main.tsx | grep -q bootstrap; then
              echo "dev server compiled"
              exit 0
            fi
            sleep 2
          done
          echo "dev server did not compile"
          exit 1

      - name: Tests
        run: bun --canary run test
