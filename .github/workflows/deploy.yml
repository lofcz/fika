name: deploy

on:
  push:
    branches: [next]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            echo "bun --canary install attempt ${attempt}/5"
            if bun --canary install --frozen-lockfile; then
              exit 0
            fi
            echo "bun --canary install failed (attempt ${attempt}/5), retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build
        run: bun --canary run build

      - name: Deploy to github pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: deploy to github pages
          publish_dir: ./dist
