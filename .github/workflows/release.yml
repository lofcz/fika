name: Release and Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# npm Trusted Publisher must list this exact filename: release.yml
# Do not publish from a laptop. OIDC only works on GitHub-hosted runners.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Create fika-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FIKA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FIKA_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require npm 11.5.1+ for OIDC
        run: |
          npm install -g npm@latest
          node -e "const [maj, min, pat] = require('child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (maj < 11 || (maj === 11 && min < 5) || (maj === 11 && min === 5 && pat < 1)) { console.error('npm >= 11.5.1 is required for trusted publishing'); process.exit(1) }"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            echo "bun --canary install attempt ${attempt}/5"
            if bun --canary install --frozen-lockfile; then
              exit 0
            fi
            echo "bun --canary install failed (attempt ${attempt}/5), retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Bump package version
        id: version
        run: |
          bun --canary pm version "${{ github.event.inputs.release_type }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build embed package
        run: bun --canary run build:embed

      # Use the npm next to `node`, not Bun's PATH shim. Pack once, verify
      # that exact tarball, then publish it so dist/embed cannot be dropped.
      - name: Pack embed tarball
        id: pack
        run: |
          set -euo pipefail
          NPM="$(dirname "$(command -v node)")/npm"
          echo "node=$(command -v node) ($(node --version))"
          echo "npm=${NPM} ($("${NPM}" --version))"
          echo "path-npm=$(command -v npm) ($(npm --version || true))"
          ls -la dist/embed/fika-embed.js dist/embed/fika-embed.css dist/embed/agentic-manifest.json dist/types/embed/index.d.ts
          DEST="${RUNNER_TEMP}/fika-pack"
          mkdir -p "${DEST}"
          "${NPM}" pack --pack-destination "${DEST}" --ignore-scripts
          TARBALL="$(find "${DEST}" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "${TARBALL}"
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"
          echo "size=$(du -h "${TARBALL}" | cut -f1)"
          echo "files=$(tar -tzf "${TARBALL}" | wc -l)"
          tar -tzf "${TARBALL}" | sed -n '1,40p'

      - name: Verify package contents
        run: node scripts/verify-embed-pack.mjs --tarball "${{ steps.pack.outputs.tarball }}"

      - name: Publish to npm
        run: |
          NPM="$(dirname "$(command -v node)")/npm"
          "${NPM}" publish "${{ steps.pack.outputs.tarball }}" --access public --ignore-scripts

      - name: Commit release version and create tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BOT_SLUG="${{ steps.app-token.outputs.app-slug }}"
          BOT_ID="$(gh api "/users/${BOT_SLUG}[bot]" --jq .id)"
          git config --local user.name "${BOT_SLUG}[bot]"
          git config --local user.email "${BOT_ID}+${BOT_SLUG}[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"

      - name: Push release commit and tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          git push --follow-tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          token: ${{ steps.app-token.outputs.token }}
