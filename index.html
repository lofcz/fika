    <style>
      .first-screen-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 22px;
        background: #f4f4f5;
      }
      .first-screen-loading-ink {
        position: relative;
        width: 72px;
        height: 72px;
      }
      .first-screen-loading-ink .blot {
        position: absolute;
        inset: 26px;
        border-radius: 50%;
        background: #18181b;
        animation: ink-blot 2s ease-in-out infinite;
      }
      .first-screen-loading-ink .ripple {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid #18181b;
        opacity: 0;
        animation: ink-ripple 2.4s ease-out infinite;
      }
      .first-screen-loading-ink .ripple:nth-child(2) {
        animation-delay: 0.8s;
      }
      .first-screen-loading-ink .ripple:nth-child(3) {
        animation-delay: 1.6s;
      }
      .first-screen-loading-text {
        max-width: 240px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.4;
        color: #71717a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes ink-blot {
        0%, 100% { transform: scale(0.72); opacity: 0.35; }
        50% { transform: scale(1); opacity: 1; }
      }
      @keyframes ink-ripple {
        0% { transform: scale(0.28); opacity: 0.5; }
        100% { transform: scale(1); opacity: 0; }
      }
    </style>
